schemaVersion: "2"
kind: mixin
name: ij-lsp
version: 0.7.0
displayName: Java and Kotlin by IntelliJ IDEA
description: Adds fast, headless IntelliJ-powered Java and Kotlin queries for coding agents.
sourceURL: https://github.com/shelajev/ij-lsp-sbx-kit
licenses:
  - Apache-2.0

args:
  accept-license:
    default: "false"
    description: Explicitly accept the JetBrains server agreement during sandbox startup
    enum: ["false", "true"]

environment:
  variables:
    IJ_LSP_ACCEPT_LICENSE: "${{ kit.args.accept-license }}"

permissions:
  network:
    allow:
      # Open VSX metadata and the small platform VSIX used only as a checksummed
      # source of JetBrains' current server-bundle.json manifest.
      - open-vsx.org
      - openvsx.eclipsecontent.org

      # IntelliJ language-server bootstrap, updates, and licensing.
      - resources.jetbrains.com
      - download.jetbrains.com
      - download-cdn.jetbrains.com
      - cache-redirector.jetbrains.com
      - account.jetbrains.com
      - plugins.jetbrains.com
      - www.jetbrains.com

setup:
  install:
    - command: |
        set -eu
        for tool in node curl tar unzip sha256sum flock; do
          command -v "$tool" >/dev/null || {
            printf 'ERROR: ij-lsp requires %s in the sandbox base image.\n' "$tool" >&2
            exit 1
          }
        done
        node --version
      description: Verify the small set of tools required by the headless bridge

  startup:
    - command:
        - chmod
        - "0755"
        - /home/agent/.local/bin/ij
        - /home/agent/.local/bin/ij-server-install
        - /home/agent/.local/lib/ij-lsp/daemon.js
      user: "1000"
      description: Restore executable modes after reproducible kit injection

    - command:
        - sh
        - -c
        - 'exec /home/agent/.local/bin/ij prepare >/dev/null'
      user: "1000"
      description: Prefetch and verify IntelliJ without starting it before the workspace is ready

agentInstructions:
  content: |
    # IntelliJ is agent-callable: run `ij ready 300` immediately

    This sandbox exposes JetBrains IntelliJ Java/Kotlin intelligence directly through the headless `ij` command. It has no UI, browser, MCP, VS Code, or editor extension host. Run `ij ready 300` first. The checksummed JetBrains server is prefetched during sandbox creation, while project import starts only after the workspace is available.

    If it returns `setupRequired: license`, stop and ask the user to run `ij accept-license` in an interactive sandbox terminal. Never accept legal terms for the user. The user may instead explicitly opt in during sandbox creation with `--kit-arg ij-lsp.accept-license=true`. Do not search MCP catalogs, the PATH, running processes, workspace configuration, or `jdtls` for another LSP.

    Prefer these semantic queries over text-only guesses:

    - `ij symbols <query>` searches workspace symbols.
    - `ij outline <file>` lists document symbols.
    - `ij definition|type-definition|implementation|references|hover <file>:<line>:<column>` queries a 1-based source position. The separate `<file> <line> <column>` form also works.
    - `ij diagnostics <file>` returns current IntelliJ diagnostics.
    - `ij code-actions <file>:<line>:<column>` and `ij rename-preview <file>:<line>:<column> <new-name>` return previews only; they never edit files.

    Results are compact JSON with workspace-relative files and 1-based positions; use global options `--raw` or `--limit N` when needed. Empty results can mean Maven, Gradle, or Bazel import and indexing are still running, so run `ij ready 300` before concluding that no symbol exists. Agent queries start and talk to JetBrains' `intellij-server` directly over stdio behind a workspace-specific private Unix socket. Only claim IntelliJ-backed results after a successful `ij` response. Continue validating changes with the project's normal build, tests, lint, and formatting.
