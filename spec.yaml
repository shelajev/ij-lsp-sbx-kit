schemaVersion: "2"
kind: mixin
name: ij-lsp
version: 0.4.0
displayName: Java and Kotlin by IntelliJ IDEA
description: Adds headless IntelliJ-powered Java and Kotlin queries for the agent plus an optional code-server editor.
sourceURL: https://github.com/shelajev/ij-lsp-sbx-kit
licenses:
  - Apache-2.0

permissions:
  network:
    allow:
      # Pinned code-server release assets.
      - github.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com

      # Open VSX metadata and extension content.
      - open-vsx.org
      - openvsx.eclipsecontent.org

      # IntelliJ language-server bootstrap, updates, and licensing.
      - resources.jetbrains.com
      - download.jetbrains.com
      - download-cdn.jetbrains.com
      - cache-redirector.jetbrains.com
      - account.jetbrains.com
      - plugins.jetbrains.com
      - www.jetbrains.com

ports:
  - container: 8080
    name: intellij-code-server

setup:
  install:
    - command: |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64)
            archive=code-server-4.135.0-linux-amd64.tar.gz
            sha256=300ef4e37e469e6368a4673c6a623e1c9ba8a34f42b394fb49c431a8900bc7d1
            ;;
          aarch64|arm64)
            archive=code-server-4.135.0-linux-arm64.tar.gz
            sha256=fe6561798415e709109cb902dca2a57a687240af7d8220f6fa1d01cd2ae0541e
            ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac
        curl -fsSL "https://github.com/coder/code-server/releases/download/v4.135.0/${archive}" -o /tmp/ij-lsp-code-server.tar.gz
        printf '%s  %s\n' "$sha256" /tmp/ij-lsp-code-server.tar.gz | sha256sum -c -
        mkdir -p /usr/local/lib
        tar -xzf /tmp/ij-lsp-code-server.tar.gz -C /usr/local/lib
        ln -sfn "/usr/local/lib/${archive%.tar.gz}/bin/code-server" /usr/local/bin/code-server
        ln -sfn "/usr/local/lib/${archive%.tar.gz}/lib/node" /usr/local/bin/ij-node
        rm -f /tmp/ij-lsp-code-server.tar.gz
        code-server --version
        ij-node --version
      description: Install the pinned code-server release and verify its checksum

    - command: |
        set -eu
        code-server --install-extension JetBrains.intellij-server --force
      user: "1000"
      description: Install the latest IntelliJ language server extension from Open VSX

  startup:
    - command:
        - sh
        - -c
        - nohup /home/agent/.local/bin/start-ij-lsp-code-server.sh > /tmp/ij-lsp-code-server.log 2>&1 &
      user: "1000"
      description: Start code-server on the sandbox workspace

  files:
    - path: /home/agent/.local/bin/start-ij-lsp-code-server.sh
      content: |
        exec code-server --bind-addr 0.0.0.0:8080 --auth none "${WORKDIR}"
      mode: "0755"
      description: Create the code-server startup wrapper with the runtime workspace path

    - path: /home/agent/.local/share/code-server/User/settings.json
      content: |
        {
          "workbench.startupEditor": "none",
          "workbench.tips.enabled": false,
          "telemetry.telemetryLevel": "off",
          "intellij.trace.server": "off",
          "intellij.dataSharing": "none"
        }
      mode: "0644"
      onlyIfMissing: true
      description: Seed privacy-conscious editor and language-server defaults without overwriting existing settings

agentInstructions:
  content: |
    # IntelliJ is agent-callable: run `ij status` immediately

    This sandbox exposes JetBrains IntelliJ Java/Kotlin intelligence directly through the headless `ij` command. It does not require VS Code, a browser, MCP discovery, or an editor extension host. Run `ij status` first; on first use it downloads the server bundle selected and checksummed by the installed JetBrains extension.

    If `ij status` returns `setupRequired: license`, stop and ask the user to run `ij accept-license` in an interactive sandbox terminal. Never accept legal terms for the user. After acceptance, run `ij wait 300` once to wait for project import and indexing. Do not search MCP catalogs, the PATH, running processes, workspace configuration, or `jdtls` for another LSP.

    Prefer these semantic queries over text-only guesses:

    - `ij symbols <query>` searches workspace symbols.
    - `ij outline <file>` lists document symbols.
    - `ij definition|type-definition|implementation|references|hover <file> <line> <column>` queries a 1-based source position.
    - `ij diagnostics <file>` returns current IntelliJ diagnostics.
    - `ij code-actions <file> <line> <column>` and `ij rename-preview <file> <line> <column> <new-name>` return previews only; they never edit files.

    Results are JSON. Empty results can mean Maven, Gradle, or Bazel import and indexing are still running, so run `ij wait 300` and recheck `ij status` before concluding that no symbol exists. Agent queries start and talk to JetBrains' `intellij-server` directly over stdio behind a private Unix socket. Only claim IntelliJ-backed results after a successful `ij` response. Continue validating changes with the project's normal build, tests, lint, and formatting.

    An optional code-server editor is also available to humans on the `intellij-code-server` port, but opening it is never an agent setup step and is not required for `ij`.
